# Keeps non-FIPS crypto out of the binaries this midstream ships.
#
# Only resolves the dependency graph, so there is nothing to compile and no
# system openssl to install.

name: FIPS Crypto

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fips-crypto:
    name: No non-FIPS crypto in shipped binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check shipped feature sets
        run: ./ci/check-fips-crypto.sh
