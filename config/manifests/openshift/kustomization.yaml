apiVersion: kustomize.config.k8s.io/v1beta1
configMapGenerator:
- envs:
  - params.env
  name: modelexpress-operator-openshift-params
generatorOptions:
  disableNameSuffixHash: true
kind: Kustomization
namespace: modelexpress-operator-system
patches:
- path: deployment-patch.yaml
  target:
    kind: Deployment
    name: modelexpress-operator
- path: service-patch.yaml
  target:
    kind: Service
    name: modelexpress-operator-metrics
- path: namespace-patch.yaml
  target:
    kind: Namespace
    name: modelexpress-operator-system
replacements:
- source:
    fieldPath: data.MODELEXPRESS_SERVER_IMAGE
    kind: ConfigMap
    name: modelexpress-operator-openshift-params
  targets:
  - fieldPaths:
    - spec.template.spec.containers.[name=operator].env.[name=RELATED_IMAGE_ODH_MODELEXPRESS_IMAGE].value
    select:
      kind: Deployment
      name: modelexpress-operator
resources:
- ../default
- apiservers-clusterrole.yaml
- apiservers-clusterrolebinding.yaml
- service-ca-configmap.yaml
- servicemonitor.yaml
