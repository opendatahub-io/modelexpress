apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: xtask
    app.kubernetes.io/name: modelexpress-operator
  name: modelexpress-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: modelexpress-operator
  template:
    metadata:
      annotations:
        prometheus.io/port: '8080'
        prometheus.io/scrape: 'true'
      labels:
        app.kubernetes.io/name: modelexpress-operator
    spec:
      containers:
      - image: quay.io/opendatahub/odh-modelexpress-operator:latest
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-metrics
          initialDelaySeconds: 5
          periodSeconds: 10
        name: operator
        ports:
        - containerPort: 8080
          name: http-metrics
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-metrics
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      serviceAccountName: modelexpress-operator
