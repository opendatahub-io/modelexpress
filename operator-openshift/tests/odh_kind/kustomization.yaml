# config/manifests/odh installed the way a platform operator installs it: into
# a namespace the platform owns, with every image set through odh/params.env.
# test_tls_kind.sh --overlay odh rewrites that file in a staged copy first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mx-platform
resources:
- namespace.yaml
- ../../../config/manifests/odh
- ../kind_crds
