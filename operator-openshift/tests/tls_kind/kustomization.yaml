# The OpenShift overlay as shipped, on kind: no ServiceMonitor CRD there, the
# operator image comes from test_tls_kind.sh instead of quay, and the default
# server image is set the way the ODH operator injects it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../config/manifests/openshift
- apiservers.config.openshift.io.crd.json
images:
- name: quay.io/opendatahub/odh-modelexpress-operator
  newName: mx-e2e/operator
  newTag: kind
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: modelexpress-operator
      namespace: modelexpress-operator-system
    spec:
      template:
        spec:
          containers:
          - name: operator
            env:
            - name: RELATED_IMAGE_ODH_MODELEXPRESS_IMAGE
              value: mx-e2e/server-openssl:kind
- patch: |-
    $patch: delete
    apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: modelexpress-operator
      namespace: modelexpress-operator-system
