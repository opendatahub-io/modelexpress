apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/opendatahub-io/modelexpress?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # The -rhaiv suffix is required, not optional: upstream ai-dynamo tags are
    # mirrored into this repo, and without it every upstream vX.Y.Z would cut a
    # downstream build. The counter also lets us rebuild the same upstream
    # version (base image CVE, prefetch change) without inventing a version.
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && target_branch.matches("^refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+-rhaiv\\.[0-9]+$")
  labels:
    appstudio.openshift.io/application: opendatahub-builds
    appstudio.openshift.io/component: odh-modelexpress-operator-ci
    pipelines.appstudio.openshift.io/type: build
  name: odh-modelexpress-operator-on-tag
  namespace: open-data-hub-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/opendatahub/odh-modelexpress-operator:{{git_tag}}
  - name: dockerfile
    value: docker/Dockerfile.operator
  # Repo root: the Dockerfile builds the Cargo workspace, so the context has to
  # contain the whole tree, not just docker/.
  - name: path-context
    value: .
  # Cargo resolves crates.io at build time and there is no prefetch config yet.
  # Flipping this to "true" needs a prefetch-input with {"type": "cargo"}.
  - name: hermetic
    value: "false"
  - name: build-platforms
    value:
    - linux/x86_64
    - linux/arm64
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/opendatahub-io/odh-konflux-central.git
    - name: revision
      value: main
    - name: pathInRepo
      value: pipeline/multi-arch-container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-modelexpress-operator-ci
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
