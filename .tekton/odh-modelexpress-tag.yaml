apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/opendatahub-io/modelexpress?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # Same expression as the operator component: one tag cuts both images, which
    # is the point of the lockstep workspace version. Keep the two in sync or a
    # release ships half its artifacts.
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && target_branch.matches("^refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+-rhaiv\\.[0-9]+$")
  labels:
    appstudio.openshift.io/application: opendatahub-builds
    appstudio.openshift.io/component: odh-modelexpress-ci
    pipelines.appstudio.openshift.io/type: build
  name: odh-modelexpress-on-tag
  namespace: open-data-hub-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/opendatahub/odh-modelexpress:{{git_tag}}
  - name: dockerfile
    value: docker/Dockerfile.ubi9
  - name: path-context
    value: .
  # Also blocked on the protoc fetch in Dockerfile.ubi9, which pulls from
  # github.com. Hermetic needs that moved to a generic-fetcher lockfile
  # alongside the cargo prefetch.
  - name: hermetic
    value: "false"
  - name: build-platforms
    value:
    - linux/x86_64
    - linux/arm64
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/opendatahub-io/odh-konflux-central.git
    - name: revision
      value: main
    - name: pathInRepo
      value: pipeline/multi-arch-container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-modelexpress-ci
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
