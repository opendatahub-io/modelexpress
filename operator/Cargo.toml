[package]
name = "modelexpress-operator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["tls-rustls"]
# FIPS builds: RHEL's openssl is validated, ring and aws-lc-rs are not.
openssl = ["tls-openssl"]
tls-openssl = ["kube/openssl-tls"]
tls-rustls = ["kube/rustls-tls"]

[dependencies]
# unstable-runtime: Controller::owns_stream, needed to feed metadata-only
# watches in place of the full-object ones Controller::owns builds
kube = { workspace = true, features = ["unstable-runtime"] }
modelexpress-types = { workspace = true }
k8s-openapi = { workspace = true, features = ["schemars"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
thiserror = { workspace = true }
chrono = { workspace = true }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[dev-dependencies]
serde_norway = "0.9"
insta = { version = "1", features = ["yaml", "redactions"] }

[lints]
workspace = true
